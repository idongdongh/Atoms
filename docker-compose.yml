services:
  atoms:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    # init: reap the detached preview/build child process trees.
    init: true
    # Keep a 2C2G host usable when a build/dev server eats memory: the OOM
    # killer lands inside this container instead of on sshd/Docker itself.
    mem_limit: 1600m
    env_file: .env
    environment:
      PORT: "3000"
      ATOMS_DATABASE_PATH: /data/control-plane.sqlite
      ATOMS_WORKSPACE_ROOT: /data/workspaces
      ATOMS_RELEASES_ROOT: /data/published
      ATOMS_TEMPLATE_ROOT: /app/templates/react-vite
      ATOMS_PREVIEW_PROVIDER: local
    volumes:
      - atoms-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then(r => { if (!r.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    build:
      context: .
      target: web
    restart: unless-stopped
    mem_limit: 192m
    depends_on:
      atoms:
        condition: service_healthy
    environment:
      # "http://<server-ip>" for plain-HTTP demos, or a bare hostname once a
      # domain exists (Caddy then enables automatic HTTPS).
      ATOMS_SITE_ADDRESS: ${ATOMS_SITE_ADDRESS:?set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  atoms-data:
  caddy-data:
  caddy-config:
